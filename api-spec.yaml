openapi: 3.0.1
info:
  title: refarch-backend
  description: This is the default starting project for a backend project based on
    the reference architecture of it@M
  version: 0.0.1-SNAPSHOT
servers:
  - url: http://localhost:8086
    description: Generated server url
tags:
  - name: Actuator
    description: Monitor and interact
    externalDocs:
      description: Spring Boot Actuator Web API Documentation
      url: https://docs.spring.io/spring-boot/docs/current/actuator-api/html/
paths:
  /zeitgutschriften/{zeitgutschriftId}:
    get:
      tags:
        - zeitgutschrift-controller
      operationId: getZeitgutschrift
      parameters:
        - name: zeitgutschriftId
          in: path
          required: true
          schema:
            minimum: 0
            exclusiveMinimum: true
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ZeitgutschriftResponseDTO"
    put:
      tags:
        - zeitgutschrift-controller
      operationId: updateZeitgutschrift
      parameters:
        - name: zeitgutschriftId
          in: path
          required: true
          schema:
            minimum: 0
            exclusiveMinimum: true
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZeitgutschriftRequestDTO"
        required: true
      responses:
        "200":
          description: OK
    delete:
      tags:
        - zeitgutschrift-controller
      operationId: deleteZeitgutschrift
      parameters:
        - name: zeitgutschriftId
          in: path
          required: true
          schema:
            minimum: 0
            exclusiveMinimum: true
            type: integer
            format: int64
      responses:
        "200":
          description: OK
  /taetigkeitenbloecke/student/{studentId}/{tag}/{beginnZeit}/{endeZeit}:
    get:
      tags:
        - taetigkeitenblock-controller
      operationId: getTaetigkeitenblock
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            minimum: 0
            exclusiveMinimum: true
            type: integer
            format: int64
        - name: tag
          in: path
          required: true
          schema:
            type: string
            format: date
        - name: beginnZeit
          in: path
          required: true
          schema:
            type: string
            format: time-local
        - name: endeZeit
          in: path
          required: true
          schema:
            type: string
            format: time-local
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TaetigkeitenblockResponseDTO"
    put:
      tags:
        - taetigkeitenblock-controller
      operationId: updateTaetigkeitenblock
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            minimum: 0
            exclusiveMinimum: true
            type: integer
            format: int64
        - name: tag
          in: path
          required: true
          schema:
            type: string
            format: date
        - name: beginnZeit
          in: path
          required: true
          schema:
            type: string
            format: time-local
        - name: endeZeit
          in: path
          required: true
          schema:
            type: string
            format: time-local
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaetigkeitenblockRequestDTO"
        required: true
      responses:
        "200":
          description: OK
    delete:
      tags:
        - taetigkeitenblock-controller
      operationId: deleteTaetigkeitenblock
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            minimum: 0
            exclusiveMinimum: true
            type: integer
            format: int64
        - name: tag
          in: path
          required: true
          schema:
            type: string
            format: date
        - name: beginnZeit
          in: path
          required: true
          schema:
            type: string
            format: time-local
        - name: endeZeit
          in: path
          required: true
          schema:
            type: string
            format: time-local
      responses:
        "200":
          description: OK
  /studiengaenge/student/{studentId}:
    put:
      tags:
        - studiengang-controller
      operationId: updateStudiengaengeByStudent
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            minimum: 0
            exclusiveMinimum: true
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentStudiengaengeRequestDTO"
        required: true
      responses:
        "200":
          description: OK
  /student/{studentId}:
    get:
      tags:
        - student-controller
      operationId: getStudent
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            minimum: 0
            exclusiveMinimum: true
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StudentResponseDTO"
    put:
      tags:
        - student-controller
      operationId: updateStudent
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            minimum: 0
            exclusiveMinimum: true
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentRequestDTO"
        required: true
      responses:
        "200":
          description: OK
    delete:
      tags:
        - student-controller
      operationId: deleteStudent
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            minimum: 0
            exclusiveMinimum: true
            type: integer
            format: int64
      responses:
        "200":
          description: OK
  /praktikum/{studentId}:
    get:
      tags:
        - praktikum-controller
      operationId: getPraktikum
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            minimum: 0
            exclusiveMinimum: true
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PraktikumResponseDTO"
    put:
      tags:
        - praktikum-controller
      operationId: updatePraktikum
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            minimum: 0
            exclusiveMinimum: true
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PraktikumRequestDTO"
        required: true
      responses:
        "200":
          description: OK
    delete:
      tags:
        - praktikum-controller
      operationId: deletePraktikum
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            minimum: 0
            exclusiveMinimum: true
            type: integer
            format: int64
      responses:
        "200":
          description: OK
  /zeitgutschriften:
    post:
      tags:
        - zeitgutschrift-controller
      operationId: createZeitgutschrift
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZeitgutschriftRequestDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: integer
                format: int64
  /taetigkeitenbloecke:
    post:
      tags:
        - taetigkeitenblock-controller
      operationId: createTaetigkeitenblock
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaetigkeitenblockRequestDTO"
        required: true
      responses:
        "200":
          description: OK
  /studiengaenge:
    get:
      tags:
        - studiengang-controller
      operationId: getStudiengaenge
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudiengangResponseDTO"
    post:
      tags:
        - studiengang-controller
      operationId: createStudiengang
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudiengangRequestDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: integer
                format: int64
  /student:
    get:
      tags:
        - student-controller
      operationId: getStudents
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentResponseDTO"
    post:
      tags:
        - student-controller
      operationId: createStudent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentRequestDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: integer
                format: int64
  /praktikum:
    post:
      tags:
        - praktikum-controller
      operationId: createPraktikum
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PraktikumRequestDTO"
        required: true
      responses:
        "200":
          description: OK
  /zeitgutschriften/student/{studentId}:
    get:
      tags:
        - zeitgutschrift-controller
      operationId: getZeitgutschriftenByStudent
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            minimum: 0
            exclusiveMinimum: true
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ZeitgutschriftResponseDTO"
  /taetigkeitenbloecke/student/{studentId}/{tag}:
    get:
      tags:
        - taetigkeitenblock-controller
      operationId: getTaetigkeitenbloeckeByStudentAndTag
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            minimum: 0
            exclusiveMinimum: true
            type: integer
            format: int64
        - name: tag
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaetigkeitenblockResponseDTO"
  /studiengaenge/{studiengangId}:
    get:
      tags:
        - studiengang-controller
      operationId: getStudiengang
      parameters:
        - name: studiengangId
          in: path
          required: true
          schema:
            minimum: 0
            exclusiveMinimum: true
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StudiengangResponseDTO"
    delete:
      tags:
        - studiengang-controller
      operationId: deleteStudiengang
      parameters:
        - name: studiengangId
          in: path
          required: true
          schema:
            minimum: 0
            exclusiveMinimum: true
            type: integer
            format: int64
      responses:
        "200":
          description: OK
  /studiengaenge/{studiengangId}/studenten:
    get:
      tags:
        - studiengang-controller
      operationId: getStudentenByStudiengang
      parameters:
        - name: studiengangId
          in: path
          required: true
          schema:
            minimum: 0
            exclusiveMinimum: true
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentResponseDTO"
  /student/me:
    get:
      tags:
        - student-controller
      operationId: getMyStudent
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StudentResponseDTO"
  /actuator:
    get:
      tags:
        - Actuator
      summary: Actuator root web endpoint
      operationId: links
      responses:
        "200":
          description: OK
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
  /actuator/sbom:
    get:
      tags:
        - Actuator
      summary: Actuator web endpoint 'sbom'
      operationId: sboms
      responses:
        "200":
          description: OK
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/json:
              schema:
                type: object
  /actuator/sbom/{id}:
    get:
      tags:
        - Actuator
      summary: Actuator web endpoint 'sbom-id'
      operationId: sbom
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/octet-stream:
              schema:
                type: object
        "404":
          description: Not Found
  /actuator/metrics:
    get:
      tags:
        - Actuator
      summary: Actuator web endpoint 'prometheus'
      operationId: scrape
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum:
              - CONTENT_TYPE_004
              - CONTENT_TYPE_OPENMETRICS_100
              - CONTENT_TYPE_PROTOBUF
        - name: includedNames
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            text/plain;version=0.0.4;charset=utf-8:
              schema:
                type: object
            application/openmetrics-text;version=1.0.0;charset=utf-8:
              schema:
                type: object
            application/vnd.google.protobuf;proto=io.prometheus.client.MetricFamily;encoding=delimited:
              schema:
                type: object
  /actuator/info:
    get:
      tags:
        - Actuator
      summary: Actuator web endpoint 'info'
      operationId: info
      responses:
        "200":
          description: OK
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/json:
              schema:
                type: object
  /actuator/health:
    get:
      tags:
        - Actuator
      summary: Actuator web endpoint 'health'
      operationId: health
      responses:
        "200":
          description: OK
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
            application/json:
              schema:
                type: object
components:
  schemas:
    ZeitgutschriftRequestDTO:
      required:
        - datum
        - grund
        - minuten
        - studentId
      type: object
      properties:
        studentId:
          minimum: 0
          exclusiveMinimum: true
          type: integer
          format: int64
        datum:
          type: string
          format: date
        minuten:
          minimum: 0
          exclusiveMinimum: true
          type: integer
          format: int32
        grund:
          maxLength: 500
          minLength: 2
          type: string
    TaetigkeitenblockRequestDTO:
      required:
        - beginnZeit
        - endeZeit
        - homeoffice
        - studentId
        - tag
      type: object
      properties:
        studentId:
          minimum: 0
          exclusiveMinimum: true
          type: integer
          format: int64
        tag:
          type: string
          format: date
        beginnZeit:
          type: string
          format: time-local
        endeZeit:
          type: string
          format: time-local
        homeoffice:
          type: boolean
        zeitraumGueltig:
          type: boolean
    StudentStudiengaengeRequestDTO:
      required:
        - studiengangIds
      type: object
      properties:
        studiengangIds:
          uniqueItems: true
          type: array
          items:
            type: integer
            format: int64
    StudentRequestDTO:
      required:
        - email
        - nachname
        - vorname
      type: object
      properties:
        vorname:
          maxLength: 100
          minLength: 2
          type: string
        nachname:
          maxLength: 100
          minLength: 2
          type: string
        email:
          maxLength: 254
          minLength: 0
          type: string
          format: email
        wochenarbeitszeit:
          maximum: 60
          minimum: 1
          type: integer
          format: int32
    PraktikumRequestDTO:
      required:
        - beginnDatum
        - benoetigteWochen
        - endDatum
        - studentId
        - wochenarbeitszeit
      type: object
      properties:
        studentId:
          minimum: 1
          type: integer
          format: int64
        beginnDatum:
          type: string
          format: date
        endDatum:
          type: string
          format: date
        benoetigteWochen:
          maximum: 52
          minimum: 1
          type: integer
          format: int32
        wochenarbeitszeit:
          maximum: 60
          minimum: 1
          type: integer
          format: int32
    StudiengangRequestDTO:
      required:
        - name
      type: object
      properties:
        name:
          maxLength: 150
          minLength: 2
          type: string
    ZeitgutschriftResponseDTO:
      type: object
      properties:
        zeitgutschriftId:
          type: integer
          format: int64
        studentId:
          type: integer
          format: int64
        datum:
          type: string
          format: date
        minuten:
          type: integer
          format: int32
        grund:
          type: string
    TaetigkeitenblockResponseDTO:
      type: object
      properties:
        studentId:
          type: integer
          format: int64
        tag:
          type: string
          format: date
        beginnZeit:
          type: string
          format: time-local
        endeZeit:
          type: string
          format: time-local
        homeoffice:
          type: boolean
    StudiengangResponseDTO:
      type: object
      properties:
        studiengangId:
          type: integer
          format: int64
        name:
          type: string
    PraktikumResponseDTO:
      type: object
      properties:
        studentId:
          type: integer
          format: int64
        beginnDatum:
          type: string
          format: date
        endDatum:
          type: string
          format: date
        benoetigteWochen:
          type: integer
          format: int32
        wochenarbeitszeit:
          type: integer
          format: int32
        taetigkeitenbloecke:
          type: array
          items:
            $ref: "#/components/schemas/TaetigkeitenblockResponseDTO"
        zeitgutschriften:
          type: array
          items:
            $ref: "#/components/schemas/ZeitgutschriftResponseDTO"
    StudentResponseDTO:
      type: object
      properties:
        studentId:
          type: integer
          format: int64
        vorname:
          type: string
        nachname:
          type: string
        email:
          type: string
        wochenarbeitszeit:
          type: integer
          format: int32
        praktikum:
          $ref: "#/components/schemas/PraktikumResponseDTO"
        studiengaenge:
          uniqueItems: true
          type: array
          items:
            $ref: "#/components/schemas/StudiengangResponseDTO"
    Link:
      type: object
      properties:
        href:
          type: string
        templated:
          type: boolean
  securitySchemes:
    bearerAuth:
      type: http
      name: bearerAuth
      scheme: bearer
      bearerFormat: JWT
